services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-momo}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-license_inspection}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-momo}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "3306:3306"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-appuser}:${MYSQL_PASSWORD:-momo}@db:3306/${MYSQL_DATABASE:-license_inspection}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-0123456789abcdef}
      JWT_ISSUER: ${JWT_ISSUER:-license-inspection-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-license-inspection-api-clients}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api.local}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_HSTS: "true"
      TRUST_PROXY_HEADERS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"

volumes:
  mysql_data:
