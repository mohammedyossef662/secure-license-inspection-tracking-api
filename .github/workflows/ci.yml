name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint, security scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Bandit security scan
        run: bandit -r app -ll

      - name: pip-audit dependency scan
        run: pip-audit -r requirements.txt

  test:
    name: Test (Python 3.12, MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: license_inspection
          MYSQL_USER: appuser
          MYSQL_PASSWORD: appuser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=40s
    env:
      ENVIRONMENT: test
      DATABASE_URL: mysql+pymysql://appuser:appuser@127.0.0.1:3306/license_inspection
      TEST_DATABASE_URL: mysql+pymysql://appuser:appuser@127.0.0.1:3306/license_inspection
      SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuv
      JWT_ISSUER: license-inspection-api
      JWT_AUDIENCE: license-inspection-api-clients
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      ALLOWED_ORIGINS: ""
      ALLOWED_HOSTS: "*"
      LOGIN_RATE_LIMIT_ATTEMPTS: "5"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
      LOGIN_RATE_LIMIT_IP_MULTIPLIER: "5"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run test suite with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore
