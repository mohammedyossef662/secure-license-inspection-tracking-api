# Render Blueprint: deploy the API (Docker) + MySQL with one click.
# Connect this repository in the Render dashboard and use "New +" > "Blueprint".
services:
  - type: web
    name: license-inspection-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: license-inspection-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DOCS_ENABLED
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

databases:
  - name: license-inspection-db
    plan: free
    databaseName: license_inspection
    user: appuser
