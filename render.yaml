# Render Blueprint: deploy the API container for this repository.
#
# Render does not offer managed MySQL and its free databases are PostgreSQL
# (and expire), so this blueprint uses an EXTERNAL MySQL 8 / MySQL-compatible
# database. Set DATABASE_URL when Render asks for the `sync: false` values.
#
# Render free web services sleep after ~15 minutes of inactivity. Use the
# `starter` plan below for a genuinely 24/7 deployment.
#
# Full walkthrough: docs/09-paas-deployment.md

services:
  - type: web
    name: license-inspection-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DOCS_ENABLED
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENABLE_HSTS
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"

      # mysql+pymysql://USER:PASSWORD@HOST:3306/DATABASE
      # The production guard in app/core/config.py rejects non-MySQL URLs.
      - key: DATABASE_URL
        sync: false

      # Public hostname of this service, e.g. license-inspection-api.onrender.com
      - key: ALLOWED_HOSTS
        sync: false
      # e.g. https://license-inspection-api.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false

      # First deploy only: set "true" and provide the passwords below, then
      # change them back to "false" so demo users are never re-created.
      - key: SEED_ON_START
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_INSPECTOR_PASSWORD
        sync: false
      - key: SEED_VIEWER_PASSWORD
        sync: false
